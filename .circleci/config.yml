version: 2.1
jobs:
  build:
    docker:
      - image: circleci/buildpack-deps:20.10
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t grafana-builder:latest .

      - run: docker run -it grafana-builder bash update.sh ${API_TOKEN}
      # - run:
      #     name: Run image
      #     command: docker run -it grafana-builder bash update.sh test

workflows:
  version: 2
  build-master:
    jobs:
      - build
