version: 2.1
jobs:
  build:
    docker:
      - image: circleci/buildpack-deps:20.10
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t grafana-builder:latest .
      - run:
          name: Run image
          command: docker run -it grafana-builder bash update.sh
workflows:
  version: 2
  build-master:
    jobs:
      - build:
          filters:
            branches:
              only: master
